<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Techeron | Chennai, India</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <style>
    :root {
      --bg1: #020617;
      --bg2: #0f172a;
      --card-bg: rgba(255, 255, 255, 0.06);
      --text: #ffffff;
      --subtext: #94a3b8;
      --button-bg: #ffffff;
      --button-text: #020617;
    }

    body.light {
      --bg1: #e0e7ff;
      --bg2: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.85);
      --text: #020617;
      --subtext: #475569;
      --button-bg: #020617;
      --button-text: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(-45deg, var(--bg1), var(--bg2), #1e3a8a, #020617);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: var(--text);
      transition: background 0.4s, color 0.4s;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border-radius: 22px;
      padding: 40px 30px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
      animation: fadeUp 1s ease forwards;
      position: relative;
    }

    /* Toggle Button */
    .theme-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .theme-toggle:hover {
      transform: rotate(20deg);
    }

    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--text);
      margin-bottom: 15px;
      animation: zoomIn 1s ease forwards;
    }

    h1 {
      font-size: 2.3rem;
      margin: 10px 0 6px;
    }

    .location {
      font-size: 0.95rem;
      color: var(--subtext);
      margin-bottom: 22px;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text);
      margin-bottom: 30px;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-decoration: none;
      background: var(--button-bg);
      color: var(--button-text);
      margin: 12px 0;
      padding: 13px;
      border-radius: 14px;
      font-weight: 600;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .links a:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 18px 30px rgba(0,0,0,0.4);
    }

    footer {
      margin-top: 26px;
      font-size: 0.85rem;
      color: var(--subtext);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="card">
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
      🌓
    </button>

    <img src="profile.jpg" alt="M Andrews" class="profile-img" />

    <h1>Techeron</h1>
    <div class="location">Chennai, India 🇮🇳</div>

    <p>
      Technology enthusiast focused on coding, automation, and continuous learning.
      Building skills, solving real-world problems, and growing every day.
    </p>

    <div class="links">
      <a href="https://github.com/mandrews25" target="_blank">
        <i class="fab fa-github"></i> GitHub
      </a>

      <a href="https://www.linkedin.com/in/mandrews25/" target="_blank">
        <i class="fab fa-linkedin"></i> LinkedIn
      </a>

      <a href="https://leetcode.com/u/Andrewsrio25/" target="_blank">
        <i class="fas fa-code"></i> LeetCode
      </a>

      <a href="https://www.credly.com/users/m-andrews/badges" target="_blank">
        <i class="fas fa-certificate"></i> Credly
      </a>

      <a href="https://topmate.io/m_andrews" target="_blank">
        <i class="fas fa-user-tie"></i> Topmate
      </a>
    </div>

    <footer>
      © 2025 Techeron
    </footer>
  </div>

  <script>
    function toggleTheme() {
      document.body.classList.toggle("light");
    }
  </script>

</body>
</html>
